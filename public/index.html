<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ödül Kampanyası</title>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ---------- Header (bordo) ---------- */
    header {
      min-height: 72px;
      background: #5a1414;
      border-bottom: 2px solid #d4af37;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header-nav {
      display: flex;
      align-items: center;
      gap: 1.5cm;
      flex-wrap: wrap;
      flex: 1;
      justify-content: center;
      margin-right: 120px; /* logo genisligi kadar: butonlar tam sayfa ortasinda durur */
    }
    .header-nav a {
      width: 4cm;
      max-width: 100%;
      padding: 10px 12px;
      text-align: center;
      text-decoration: none;
      color: #f2e8d5;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.2);
      transition: background 0.2s;
    }
    .header-nav a:hover { background: #d4af37; color: #5a1414; }
    /*
      Oyun logonuzu buraya koyun: public/gorseller/logo.png
      Dosya yoksa otomatik olarak "LOGO" yazan bos bir kutu gosterilir.
    */
    .logo-gorsel {
      height: 44px;
      display: block;
    }
    .logo-gorsel-bos {
      height: 44px;
      width: 120px;
      border: 1px dashed rgba(212, 175, 55, 0.6);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      font-size: 11px;
      letter-spacing: 1px;
    }

    /* ---------- Sayfa govdesi / arka plan ---------- */
    main {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      position: relative;
      background: #1a1410 url('gorseller/anasayfa-arkaplan.jpg') center/cover no-repeat;
    }
    /* gorseller/anasayfa-arkaplan.jpg eklenmezse koyu bir degrade zemin gosterilir */
    main::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(30,20,15,0.55) 0%, rgba(10,8,6,0.85) 100%);
    }

    .kart {
      position: relative;
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 36px 32px;
      background: rgba(10, 8, 6, 0.45);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 12px;
    }

    .odul-gorsel {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      object-fit: cover;
      background: #12141a;
      display: block;
      margin-bottom: 22px;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }
    .odul-gorsel-bos {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      background: rgba(0,0,0,0.25);
      border: 2px dashed rgba(212, 175, 55, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      font-size: 13px;
      margin-bottom: 22px;
      text-align: center;
      padding: 16px;
    }

    h1 {
      font-family: 'MedievalSharp', Georgia, serif;
      font-size: 30px;
      margin: 0 0 10px;
      color: #f4d35e;
      letter-spacing: 1px;
      text-shadow:
        0 0 8px rgba(244, 211, 94, 0.8),
        0 2px 2px rgba(0,0,0,0.8);
    }
    p.aciklama {
      color: #f2f2f2;
      font-size: 15px;
      margin: 0 0 26px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .buyuk-buton {
      width: 100%;
      padding: 14px;
      border-radius: 6px;
      border: none;
      background: #e2572b;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .buyuk-buton:hover { background: #cf4c22; }

    /* ---------- Footer / sosyal medya ---------- */
    footer {
      background: #5a1414;
      border-top: 2px solid #d4af37;
      padding: 20px 24px;
    }
    .sosyal {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 900px;
      margin: 0 auto;
    }
    .sosyal a {
      min-width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f2e8d5;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 0 10px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .sosyal a img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      display: block;
    }
    /* ikon dosyasi yoksa yazi gosterilir, buton da hapa donusur */
    .sosyal a.ikonsuz { border-radius: 24px; }
    .sosyal a:hover { background: rgba(212, 175, 55, 0.25); }
    .sosyal a:focus-visible, .header-nav a:focus-visible {
      outline: 2px solid #d4af37;
      outline-offset: 2px;
    }

    .gizli { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img src="gorseller/logo.png" alt="Oyun logosu" class="logo-gorsel gizli" id="logoGorsel"
         onload="this.classList.remove('gizli'); document.getElementById('logoGorselBos').classList.add('gizli');"
         onerror="this.classList.add('gizli'); document.getElementById('logoGorselBos').classList.remove('gizli');">
    <div class="logo-gorsel-bos" id="logoGorselBos">LOGO</div>

    <!-- Menu: isimleri ve linkleri (href) kendinize gore duzenleyin -->
    <nav class="header-nav">
      <a href="">ANASAYFA</a>
      <a href="">HABERLER</a>
      <a href="">TOPLULUK</a>
      <a href="">KEŞFET</a>
      <a href="">GÜNCELLEMELER</a>
    </nav>
  </header>

  <main>
    <div class="kart">
      <!--
        Odul gorselini buraya koyun: public/gorseller/odul.png
        Dosya yoksa asagida otomatik olarak "gorsel bekleniyor" kutusu gosterilir.
      -->
      <img src="gorseller/odul.png" alt="Ödül görseli" class="odul-gorsel gizli" id="odulGorsel"
           onload="this.classList.remove('gizli'); document.getElementById('odulGorselBos').classList.add('gizli');"
           onerror="this.classList.add('gizli'); document.getElementById('odulGorselBos').classList.remove('gizli');">
      <div class="odul-gorsel-bos" id="odulGorselBos">
        Ödül görseli buraya gelecek<br>(public/gorseller/odul.png dosyasını ekleyin)
      </div>

      <h1>Ödülünü Kazanmaya Hazır Mısın?</h1>
      <p class="aciklama">Ödülünü almak için hemen giriş yap.</p>

      <button class="buyuk-buton" onclick="window.location.href='giris.html'">Giriş Yap</button>
    </div>
  </main>

  <footer>
    <!--
      Sosyal medya linklerini href="" icine yazin.
      Ikonlari buraya koyun: public/gorseller/ikonlar/ (twitter.png, facebook.png, instagram.png,
      youtube.png, discord.png, reddit.png, twitch.png, wikipedia.png)
      Ikon dosyasi yoksa buton otomatik olarak yazi gosterir.
    -->
    <nav class="sosyal" aria-label="Sosyal medya">
      <a href="" target="_blank" rel="noopener" aria-label="Twitter" title="Twitter">
        <img src="gorseller/ikonlar/twitter.png" alt="Twitter">
      </a>
      <a href="" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook">
        <img src="gorseller/ikonlar/facebook.png" alt="Facebook">
      </a>
      <a href="" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">
        <img src="gorseller/ikonlar/instagram.png" alt="Instagram">
      </a>
      <a href="" target="_blank" rel="noopener" aria-label="YouTube" title="YouTube">
        <img src="gorseller/ikonlar/youtube.png" alt="YouTube" onerror="ikonYok(this)">
      </a>
      <a href="" target="_blank" rel="noopener" aria-label="Discord" title="Discord">
        <img src="gorseller/ikonlar/discord.png" alt="Discord">
      </a>
      <a href="" target="_blank" rel="noopener" aria-label="Reddit" title="Reddit">
        <img src="gorseller/ikonlar/reddit.png" alt="Reddit">
      </a>
      <a href="" target="_blank" rel="noopener" aria-label="Twitch" title="Twitch">
        <img src="gorseller/ikonlar/twitch.png" alt="Twitch">
      </a>
      <a href="" target="_blank" rel="noopener" aria-label="Wikipedia" title="Wikipedia">
        <img src="gorseller/ikonlar/wikipedia.png" alt="Wikipedia">
      </a>
    </nav>
  </footer>

  <script>
    // href'i bos olan linkler tiklaninca hicbir sey yapmaz (sayfa yenilenmez / yeni sekme acilmaz)
    document.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        if (!a.getAttribute('href')) e.preventDefault();
      });
    });
  </script>
</body>
</html>
